[project]
name = "langchain-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sankhojjal", email = "sankhojjalc@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "langchain>=1.5.0",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.8.0",
    "langchain-pinecone>=0.2.13",
    "langchain-unstructured>=1.0.1",
    "python-dotenv>=1.2.4",
    "unstructured>=0.27.37",
]

[project.scripts]
langchain-course = "langchain_course:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
